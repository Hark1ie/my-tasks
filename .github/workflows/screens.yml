name: Screens

# Runs My Tasks on a test phone, taps through its screens and publishes screenshots.
on:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/screens.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the test APK (no sign-in, data in memory)
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Allow hardware acceleration for the test phone
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on a test phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/screens.py

      - name: Publish the screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/screens
          cd out && zip -qr screens.zip screens && ls -la screens.zip
          gh release create "screens-${{ github.run_number }}" screens.zip \
            --title "Test phone screenshots, run ${{ github.run_number }}" \
            --notes "Screenshots of My Tasks from the automated test phone." \
            --latest=false
